<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooms — Dormiway Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/admin-guard.js"></script>
</head>
<body class="bg-[#F5F3EF] text-[#1A1714] antialiased">
  <div class="admin-layout flex min-h-screen bg-[#F5F3EF]">
        <aside class="sidebar fixed inset-y-0 left-0 z-40 flex h-[100dvh] w-64 shrink-0 -translate-x-full flex-col overflow-y-auto border-r border-[#E8E2D8] bg-white p-5 transition-all duration-300 lg:sticky lg:top-0 lg:h-[100dvh] lg:translate-x-0" id="sidebar">
      <div class="sidebar__brand mb-6 flex items-center justify-between rounded-md bg-[#1A1714] px-3.5 py-3 text-white">
        <div class="flex items-center gap-2.5">
          <img src="../assets/images/admin/logo.webp" alt="Dormiway" class="sidebar__brand-logo h-7 w-7 object-contain" onerror="this.style.display='none'" />
          <span class="sidebar__brand-name font-['Cormorant_Garamond',Georgia,serif] text-xl font-medium tracking-[0.08em]">Dormiway</span>
        </div>
        <button class="sidebar__collapse-btn hidden cursor-pointer text-white/75 transition hover:text-white lg:block" id="sidebarCollapseBtn" aria-label="Collapse sidebar">
          <svg class="transition-transform duration-300" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <p class="sidebar__section-label mb-2 text-[10px] font-medium tracking-[0.2em] text-[#A89F96] uppercase">Workspace</p>

      <nav class="sidebar__nav flex flex-1 flex-col gap-1" aria-label="Admin navigation">
        <a href="dashboard.html" class="sidebar__nav-item flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[#6B6460] transition hover:bg-[#FAF8F5] hover:text-[#1A1714]" title="Overview">
          <svg class="sidebar__nav-icon h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Overview</span>
        </a>
        <a href="reservations.html" class="sidebar__nav-item flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[#6B6460] transition hover:bg-[#FAF8F5] hover:text-[#1A1714]" title="Reservations">
          <svg class="sidebar__nav-icon h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Reservations</span>
        </a>
        <a href="rooms.html" class="sidebar__nav-item active flex items-center gap-3 rounded-md bg-[#F5EFE0] px-3 py-2.5 text-sm font-medium text-[#1A1714]" title="Rooms">
          <svg class="sidebar__nav-icon h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Rooms</span>
        </a>
        <a href="guests.html" class="sidebar__nav-item flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[#6B6460] transition hover:bg-[#FAF8F5] hover:text-[#1A1714]" title="Guests">
          <svg class="sidebar__nav-icon h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          <span>Guests</span>
        </a>
        <a href="payments.html" class="sidebar__nav-item flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[#6B6460] transition hover:bg-[#FAF8F5] hover:text-[#1A1714]" title="Payments">
          <svg class="sidebar__nav-icon h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          <span>Payments</span>
        </a>
        <a href="reports.html" class="sidebar__nav-item flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[#6B6460] transition hover:bg-[#FAF8F5] hover:text-[#1A1714]" title="Reports">
          <svg class="sidebar__nav-icon h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Reports</span>
        </a>
        <a href="settings.html" class="sidebar__nav-item flex items-center gap-3 rounded-md px-3 py-2.5 text-sm text-[#6B6460] transition hover:bg-[#FAF8F5] hover:text-[#1A1714]" title="Settings">
          <svg class="sidebar__nav-icon h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar__profile mt-4 flex items-center justify-between border-t border-[#E8E2D8] pt-4">
        <div class="flex items-center gap-3">
          <div class="sidebar__profile-avatar flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#1A1714] text-xs font-medium text-white" id="sidebarAvatar">—</div>
          <div class="sidebar__profile-info">
            <p class="sidebar__profile-name text-xs font-medium text-[#1A1714]" id="sidebarName">Admin</p>
            <p class="sidebar__profile-role text-[11px] text-[#6B6460]">Property manager</p>
          </div>
        </div>
        <button id="adminLogoutBtn" class="cursor-pointer text-[11px] text-[#7A6248] hover:underline" title="Sign out">Sign out</button>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex items-center justify-between border-b border-[#E8E2D8] bg-white px-6 py-3.5">
        <div class="flex items-center gap-4">
          <button class="flex flex-col gap-1 lg:hidden" id="sidebarToggle" aria-label="Toggle sidebar">
            <span class="block h-0.5 w-5 bg-[#1A1714]"></span>
            <span class="block h-0.5 w-5 bg-[#1A1714]"></span>
            <span class="block h-0.5 w-5 bg-[#1A1714]"></span>
          </button>
          <div class="flex items-center gap-2 text-xs text-[#6B6460]">
            <span>Dashboard</span><span>/</span><span class="font-medium text-[#1A1714]">Rooms</span>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <span class="hidden text-xs text-[#6B6460] md:inline" id="topnavDate">—</span>
          <a href="../index.html" class="border border-[#E8E2D8] px-3 py-1.5 text-xs text-[#6B6460] transition hover:border-[#1A1714] hover:text-[#1A1714]">← Back to site</a>
          <button type="button" data-admin-logout class="cursor-pointer bg-[#1A1714] px-3 py-1.5 text-xs font-medium text-white transition hover:bg-[#7A6248]">Logout</button>
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-[#1A1714] text-xs font-medium text-white" id="topbarAvatar">—</div>
        </div>
      </header>

      <main class="flex-1 space-y-6 p-6 lg:p-8">
        <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
          <div>
            <p class="text-[11px] font-medium tracking-[0.2em] text-[#7A6248] uppercase">Inventory</p>
            <h1 class="mt-1 font-['Cormorant_Garamond',Georgia,serif] text-3xl font-normal text-[#1A1714]">Rooms &amp; Suites</h1>
          </div>
          <button id="openAddRoomBtn" class="cursor-pointer bg-[#1A1714] px-5 py-2.5 text-xs font-medium tracking-[0.14em] text-white uppercase hover:bg-[#7A6248]">
            + Add Room
          </button>
        </div>

        <section id="roomsGrid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
          <p class="col-span-full py-10 text-center text-xs text-[#9C948B]">Loading rooms…</p>
        </section>
      </main>
    </div>
  </div>

  <!-- Add Room Modal -->
  <div id="roomModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-md border border-[#E8E2D8] bg-white p-6">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="font-['Cormorant_Garamond',Georgia,serif] text-2xl font-normal text-[#1A1714]">Add Room</h2>
        <button id="closeRoomModal" class="cursor-pointer text-sm text-[#6B6460] hover:text-[#1A1714]">✕</button>
      </div>
      <form id="roomForm" class="space-y-4">
        <div>
          <label class="block text-[10px] font-medium tracking-[0.18em] text-[#7A6248] uppercase">Room Name</label>
          <input type="text" id="rmName" required class="mt-1 w-full border border-[#DDD5C8] bg-[#FAF8F5] px-3 py-2 text-sm" placeholder="Executive Suite — Terrace" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-medium tracking-[0.18em] text-[#7A6248] uppercase">Type</label>
            <select id="rmType" class="mt-1 w-full border border-[#DDD5C8] bg-[#FAF8F5] px-3 py-2 text-sm">
              <option value="Standard Suite">Standard Suite</option>
              <option value="Executive Suite">Executive Suite</option>
              <option value="Presidential Suite">Presidential Suite</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-medium tracking-[0.18em] text-[#7A6248] uppercase">Capacity</label>
            <input type="number" id="rmCapacity" min="1" value="2" required class="mt-1 w-full border border-[#DDD5C8] bg-[#FAF8F5] px-3 py-2 text-sm" />
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-medium tracking-[0.18em] text-[#7A6248] uppercase">Price per Night ($)</label>
          <input type="number" id="rmPrice" min="1" required class="mt-1 w-full border border-[#DDD5C8] bg-[#FAF8F5] px-3 py-2 text-sm" placeholder="120" />
        </div>
        <div>
          <label class="block text-[10px] font-medium tracking-[0.18em] text-[#7A6248] uppercase">Description</label>
          <textarea id="rmDesc" rows="2" class="mt-1 w-full border border-[#DDD5C8] bg-[#FAF8F5] px-3 py-2 text-sm"></textarea>
        </div>
        <button type="submit" class="w-full cursor-pointer bg-[#1A1714] py-3 text-xs tracking-[0.16em] text-white uppercase hover:bg-[#7A6248]">
          Save Room
        </button>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin-rooms.js"></script>
</body>
</html>
